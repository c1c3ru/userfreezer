name: build-packages

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-packages.yml"
      - "packaging/**"
      - "admin_ipc*.py"
      - "admin_client.py"
      - "deepfreezer.py"
      - "enforcement_health.py"
      - "VERSION"
      - "CHANGELOG.md"
  push:
    branches: [main]
    paths: [VERSION]
    tags:
      - "v*"

jobs:
  unit-tests:
    name: release-tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify syntax
        run: python -m compileall -q .
      - name: Run tests
        run: python run_tests.py -v

  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag against VERSION and CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          expected="v${version}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME diverge de VERSION=$version"
            exit 1
          fi
          if ! grep -Fxq "## $expected" CHANGELOG.md; then
            echo "::error::CHANGELOG.md sem secao ## $expected"
            exit 1
          fi

      - name: Build .deb
        run: packaging/linux/build_deb.sh dist

      - name: Validate Debian package metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          pkg="dist/deepfreezer_${version}_all.deb"
          test -f "$pkg" || { echo "::error::Pacote ausente: $pkg"; exit 1; }
          actual="$(dpkg-deb -f "$pkg" Version)"
          test "$actual" = "$version" || {
            echo "::error::Pacote $pkg possui Version=$actual, esperado $version"
            exit 1
          }

      - name: Install and smoke-test the .deb
        run: |
          set -e
          sudo dpkg -i dist/*.deb
          dpkg -L deepfreezer
          sudo python3 -c "
          import json
          json.dump({'targets': [{'target': '/tmp/df-ci-target'}]}, open('/etc/deepfreezer/config.json', 'w'))
          "
          sudo mkdir -p /tmp/df-ci-target
          sudo python3 -B /opt/deepfreezer/deepfreezerd.py --config /etc/deepfreezer/config.json -v
          sudo python3 -c "
          import json
          r=json.load(open('/var/lib/deepfreezer/status.json', encoding='utf-8'))
          assert r['state']=='healthy', r
          assert r['protection_scope']=='application-level', r
          assert r['successful_targets']==1, r
          "
          sudo dpkg -P deepfreezer
          test ! -d /opt/deepfreezer
          test ! -d /etc/deepfreezer

      - uses: actions/upload-artifact@v4
        with:
          name: deepfreezer-deb
          path: dist/*.deb

  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install "pywin32==310" "pyinstaller==6.16.0"

      - name: Build deepfreezer_service_windows-10-11.exe
        run: >
          pyinstaller --onefile --noconsole --name deepfreezer_service_windows-10-11
          --hidden-import win32timezone
          --hidden-import deepfreezer
          --hidden-import admin_ipc
          --hidden-import admin_ipc_win
          --paths .
          packaging/windows/deepfreezer_service.py

      - name: Sanity-check the built exe exists and is a real PE binary
        shell: pwsh
        run: |
          $exe = "dist/deepfreezer_service_windows-10-11.exe"
          if (-not (Test-Path $exe)) { throw "exe nao foi gerado: $exe" }
          $item = Get-Item $exe
          Write-Host "gerado: $($item.FullName) ($($item.Length) bytes)"
          if ($item.Length -lt 1000000) { throw "exe suspeito de tamanho pequeno demais: $($item.Length) bytes" }

      - uses: actions/upload-artifact@v4
        with:
          name: deepfreezer-exe
          path: dist/deepfreezer_service_windows-10-11.exe

  # Python 3.9+ nao roda mais no Windows 7 (3.8 foi a ultima versao
  # compativel) -- o job build-exe acima usa 3.11, entao o binario que
  # ele gera nao inicia em Windows 7. Este job compila uma segunda vez
  # com Python 3.8 especificamente pra isso. NAO TESTADO numa maquina
  # Windows 7 real (nem o Python 3.8 nem o bootloader do PyInstaller
  # foram confirmados rodando de fato nesse SO neste repositorio) --
  # se mesmo assim nao iniciar, o proximo suspeito e' o bootloader do
  # PyInstaller instalado (versoes muito novas podem ter deixado de
  # suportar Windows 7 independente do Python usado).
  build-exe-win7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install build dependencies
        run: python -m pip install "pywin32==306" "pyinstaller==5.13.2"

      - name: Build deepfreezer_service_windows-7-8.exe (Python 3.8, compativel com Windows 7)
        run: >
          pyinstaller --onefile --noconsole --name deepfreezer_service_windows-7-8
          --hidden-import win32timezone
          --hidden-import deepfreezer
          --hidden-import admin_ipc
          --hidden-import admin_ipc_win
          --paths .
          packaging/windows/deepfreezer_service.py

      - name: Sanity-check the built exe exists and is a real PE binary
        shell: pwsh
        run: |
          $exe = "dist/deepfreezer_service_windows-7-8.exe"
          if (-not (Test-Path $exe)) { throw "exe nao foi gerado: $exe" }
          $item = Get-Item $exe
          Write-Host "gerado: $($item.FullName) ($($item.Length) bytes)"
          if ($item.Length -lt 1000000) { throw "exe suspeito de tamanho pequeno demais: $($item.Length) bytes" }

      - uses: actions/upload-artifact@v4
        with:
          name: deepfreezer-exe-win7
          path: dist/deepfreezer_service_windows-7-8.exe

  # Scripts de instalacao do servico (app-level), pra quem baixa so' o
  # .exe da pagina de Releases sem clonar o repositorio.
  package-service-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip service install scripts
        run: |
          mkdir -p dist
          zip -j dist/deepfreezer-windows-service-scripts.zip \
            packaging/windows/install_service_exe.ps1 \
            packaging/windows/install_service_pywin32.ps1 \
            packaging/windows/install_service_nssm.ps1 \
            packaging/windows/install.bat \
            packaging/windows/uninstall.bat \
            packaging/windows/harden_acl.ps1 \
            packaging/windows/show_health.ps1 \
            packaging/windows/README.md

      - uses: actions/upload-artifact@v4
        with:
          name: deepfreezer-windows-service-scripts
          path: dist/deepfreezer-windows-service-scripts.zip

  # Testa o caminho de instalacao mais simples (so' o .exe + os scripts
  # baixados, sem Python na maquina) exatamente como um usuario final
  # monta: os artifacts de build-exe e package-service-scripts numa
  # mesma pasta. Roda de verdade num windows-latest: instala, inicia,
  # confirma que o enforcement rodou (overlay criado a partir de um
  # alvo real), confere a ACL via icacls, para e desinstala.
  test-windows-service:
    runs-on: windows-latest
    needs: [build-exe, package-service-scripts]
    steps:
      - name: Download the built exe
        uses: actions/download-artifact@v4
        with:
          name: deepfreezer-exe
          path: test

      - name: Download the service scripts zip
        uses: actions/download-artifact@v4
        with:
          name: deepfreezer-windows-service-scripts
          path: test

      - name: Extract scripts next to the exe (same layout a user gets)
        shell: pwsh
        run: |
          Expand-Archive -Path test\deepfreezer-windows-service-scripts.zip -DestinationPath test -Force
          Remove-Item test\deepfreezer-windows-service-scripts.zip
          Get-ChildItem test

      - name: Install, start and uninstall the real Windows service
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          & "test\install_service_exe.ps1"

          # Verifica JSON do instalador antes que o teste substitua a configuracao.
          $configPath = "C:\ProgramData\DeepFreezer\config.json"
          $configBytes = [System.IO.File]::ReadAllBytes($configPath)
          if ($configBytes.Length -ge 3 -and $configBytes[0] -eq 0xEF -and $configBytes[1] -eq 0xBB -and $configBytes[2] -eq 0xBF) {
            throw "config.json criado com UTF-8 BOM"
          }
          & python -c "import json; json.load(open(r'C:\ProgramData\DeepFreezer\config.json', encoding='utf-8'))"
          if ($LASTEXITCODE -ne 0) { throw "config.json nao foi aceito pelo parser Python" }

          New-Item -ItemType Directory -Force -Path "C:\df-ci-target" | Out-Null
          "original" | Out-File -Encoding ascii "C:\df-ci-target\f.txt"
          $cfg = @{ targets = @(@{ target = "C:\df-ci-target" }) } | ConvertTo-Json
          Set-Content -Path "C:\ProgramData\DeepFreezer\config.json" -Value $cfg

          $svc = Get-Service -Name DeepFreezer
          Write-Host "registrado: status=$($svc.Status) startType=$($svc.StartType)"
          if ($svc.StartType -ne "Automatic") { throw "StartType inesperado: $($svc.StartType)" }

          try {
              Start-Service DeepFreezer
          } catch {
              Write-Host "--- Start-Service falhou. Nada no Event Log nas duas tentativas ---"
              Write-Host "--- anteriores -- rodando 'debug' pra pegar o traceback real ---"
              $p = Start-Process -FilePath "test\deepfreezer_service_windows-10-11.exe" -ArgumentList "debug" `
                  -RedirectStandardOutput "debug_stdout.txt" -RedirectStandardError "debug_stderr.txt" `
                  -PassThru -NoNewWindow
              Start-Sleep -Seconds 5
              if (-not $p.HasExited) {
                  Write-Host "(processo 'debug' ainda rodando 5s depois -- matando)"
                  Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              } else {
                  Write-Host "(processo 'debug' saiu sozinho, exit code $($p.ExitCode))"
              }
              Write-Host "--- debug stdout ---"
              Get-Content "debug_stdout.txt" -ErrorAction SilentlyContinue
              Write-Host "--- debug stderr ---"
              Get-Content "debug_stderr.txt" -ErrorAction SilentlyContinue

              if (Test-Path "C:\ProgramData\DeepFreezer\deepfreezer.log") {
                  Write-Host "--- deepfreezer.log ---"
                  Get-Content "C:\ProgramData\DeepFreezer\deepfreezer.log"
              } else {
                  Write-Host "--- deepfreezer.log nao existe ---"
              }
              throw
          }
          Start-Sleep -Seconds 5
          # O servico deve manter o Named Pipe real acessivel.
          # O status nao fornece privilegiados nem garante protecao OS-level.
          $retry = 0
          $pipeOk = $false
          while ($retry -lt 20 -and -not $pipeOk) {
              try {
                  $client = New-Object System.IO.Pipes.NamedPipeClientStream(
                      ".", "DeepFreezerAdmin",
                      [System.IO.Pipes.PipeDirection]::InOut)
                  $client.Connect(1000)
                  $client.Dispose()
                  $pipeOk = $true
              } catch {
                  Start-Sleep -Milliseconds 300
              }
              $retry += 1
          }
          if (-not $pipeOk) { throw "Named pipe administrativo nao foi criado" }
          # Confirma que o EXE publicado contem o CLI exigido para UAC.
          $adminClient = Start-Process -FilePath "test\deepfreezer_service_windows-10-11.exe" `
              -ArgumentList "--admin-cli status" -Wait -PassThru
          if ($adminClient.ExitCode -ne 0) {
              throw "EXE --admin-cli status retornou $($adminClient.ExitCode)"
          }

          $svc = Get-Service -Name DeepFreezer
          Write-Host "apos Start-Service: status=$($svc.Status)"
          if ($svc.Status -ne "Running") { throw "servico nao ficou Running" }

          if (Test-Path "C:\ProgramData\DeepFreezer\deepfreezer.log") {
              Write-Host "--- deepfreezer.log ---"
              Get-Content "C:\ProgramData\DeepFreezer\deepfreezer.log"
          }
          if (-not (Test-Path "C:\df-ci-target.dfreezer")) {
              throw "overlay C:\df-ci-target.dfreezer nao foi criado -- enforcement nao rodou de verdade"
          }
          # Running nao garante que todos os alvos foram aplicados.
          $healthPath = "C:\ProgramData\DeepFreezer\status.json"
          if (-not (Test-Path $healthPath)) { throw "status de enforcement nao publicado" }
          $health = Get-Content $healthPath -Raw | ConvertFrom-Json
          if ($health.state -ne "healthy" -or $health.successful_targets -ne 1 -or $health.protection_scope -ne "application-level") {
              throw "servico Running com estado de enforcement inesperado"
          }
          Write-Host "--- ACL do overlay (icacls) ---"
          icacls "C:\df-ci-target.dfreezer"

          # install_service_exe.ps1 -Uninstall ja para o servico (se
          # estiver rodando) e so' retorna depois de confirmar que ele
          # sumiu do SCM -- nao precisa parar antes nem esperar depois.
          & "test\install_service_exe.ps1" -Uninstall
          Write-Host "uninstall OK -- servico DeepFreezer nao existe mais"

  package-os-level:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip Windows OS-level tooling (os_detect.py + os_level scripts)
        run: |
          mkdir -p dist
          zip -r dist/deepfreezer-windows-os-level.zip \
            packaging/windows/os_detect.py \
            packaging/windows/test_os_detect.py \
            packaging/windows/os_level \
            packaging/windows/README.md

      - uses: actions/upload-artifact@v4
        with:
          name: deepfreezer-windows-os-level
          path: dist/deepfreezer-windows-os-level.zip

  release:
    needs: [unit-tests, build-deb, build-exe, build-exe-win7, package-service-scripts, package-os-level, test-windows-service]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version from protected commit
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Block updating existing public tags on version-bump main
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"; then
            echo "::error::A tag $RELEASE_TAG ja existe; release imutavel"
            exit 1
          fi


      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verificar lista de artefatos, gerar SHA256SUMS e SPDX
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/release_metadata.py \
            --version "$(tr -d '[:space:]' < VERSION)" \
            --artifacts artifacts --out release-meta
          test -s release-meta/SHA256SUMS
          test -s release-meta/release.spdx.json

      # Usa a secao do CHANGELOG.md da versao sendo publicada como corpo
      # da release. Se a tag nao tiver secao propria, sai um arquivo
      # vazio e a release e' publicada sem corpo, como antes -- este
      # passo nunca derruba o job.
      - name: Extract release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          python3 - "${RELEASE_TAG}" > release_notes.md <<'PY'
          import io, re, sys
          tag = sys.argv[1]
          text = io.open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## %s\s*$(.*?)(?=^## |\Z)" % re.escape(tag),
                        text, re.M | re.S)
          sys.stdout.write(m.group(1).strip() if m else "")
          PY
          if [ ! -s release_notes.md ]; then
            echo "::error::Release sem notas especificas para ${GITHUB_REF_NAME}"
            exit 1
          fi
          # A tabela de "qual arquivo baixar" e' a mesma em toda release,
          # entao mora num arquivo so' e e' anexada aqui em vez de ser
          # repetida em cada secao do CHANGELOG.
          if [ -f packaging/DOWNLOADS.md ]; then
            printf '\n\n' >> release_notes.md
            cat packaging/DOWNLOADS.md >> release_notes.md
          fi
          echo "--- corpo da release ---"
          cat release_notes.md

      - name: Attest provenance of release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: artifacts/**/*

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release_notes.md
          files: |
            artifacts/deepfreezer-deb/*.deb
            artifacts/deepfreezer-exe/*.exe
            artifacts/deepfreezer-exe-win7/*.exe
            artifacts/deepfreezer-windows-service-scripts/*.zip
            artifacts/deepfreezer-windows-os-level/*.zip
            release-meta/SHA256SUMS
            release-meta/release.spdx.json
