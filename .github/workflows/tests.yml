name: tests

# Gate de verificacao: roda a cada push na main e em todo pull request
# pra main. O build-packages.yml continua responsavel so' pelo release
# (tag v* / disparo manual) -- este workflow nao publica nada.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Push novo na mesma branch/PR cancela o run anterior, que ja' esta
# desatualizado.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: testes (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # O projeto roda nos dois SOs, entao os testes tambem.
          # Python 3.8 e' o piso pratico: e' a ultima versao que roda em
          # Windows 7, alvo do build-exe-win7 no build-packages.yml.
          # (3.8 nao tem build pro runner ubuntu-24.04, dai o 22.04.)
          - os: ubuntu-22.04
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pywin32 for real pipe integration tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install pywin32==310

      # Pega erro de sintaxe em arquivo que nenhum teste importa ainda
      # (ui/, packaging/...) sem precisar instalar pystray & cia.
      - name: Checar sintaxe de todos os .py
        run: python -m compileall -q .

      - name: Rodar a suite de testes
        run: python run_tests.py -v
      - name: Smoke Tk Windows em processo GUI isolado
        if: runner.os == 'Windows'
        run: python -m unittest -v ui.smoke_panel_windows

      - name: Verificar prova de reboot no VM probe (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/windows/os_level/test_vm_probe_no_reboot.ps1
      - name: Bloquear VHDX reset fora de WinPE sem modificar discos
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/windows/os_level/test_vhdx_safety_dryrun.ps1


  linux-kernel-overlayfs:
    name: smoke real OverlayFS kernel (diretorio descartavel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar filtro real e provar escrita externa descartada apos umount
        run: bash packaging/linux/test_overlayfs_kernel_ci.sh

  linux-ui-smoke:
    name: painel Tk em sessao virtual X11 e screenshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar ambiente grafico isolado
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb python3-tk scrot
      - name: Testar UI e capturar screenshot real
        run: |
          mkdir -p ui-artifacts
          xvfb-run -a python3 -m ui.smoke_panel --screenshot ui-artifacts/panel-linux.png
      - uses: actions/upload-artifact@v4
        with:
          name: deepfreezer-panel-linux-ci
          path: ui-artifacts/panel-linux.png
